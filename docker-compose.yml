services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      - "5432:5432"
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker: o volume monta a pasta de cima.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d prisma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18-data:
